# 应用服务 WEB 访问端口
server.port=5050
ws.port=5051
server.servlet.context-path=/api
#session过期时间 60M 一个小时
server.servlet.session.timeout=PT60M
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
#错误页处理
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
#数据库配置
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:mychat}?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf8&autoReconnect=true&allowMultiQueries=true\
  &useSSL=false
# 账号密码走环境变量，读不到才用后面的默认值。
# 这个文件是提交进git的，真密码写在这里会跟着推到远端
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.pool-name=HikariCPDatasource
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=180000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1
#Spring redis配置（Spring Boot 3.x使用spring.data.redis前缀）
# Redis数据库索引（默认为0）
spring.data.redis.database=0
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
# 连接池最大连接数（使用负值表示没有限制）
spring.data.redis.jedis.pool.max-active=20
# 连接池最大阻塞等待时间（使用负值表示没有限制）
spring.data.redis.jedis.pool.max-wait=-1
# 连接池中的最大空闲连接
spring.data.redis.jedis.pool.max-idle=10
# 连接池中的最小空闲连接
spring.data.redis.jedis.pool.min-idle=0
# 连接超时时间（毫秒）
spring.data.redis.timeout=2000
# 服务端文件存放目录（头像、聊天图片视频、日志都在这里），必须可写。
# 默认值是Windows风格，Linux/macOS请设 MYCHAT_HOME 环境变量，
# 例如 export MYCHAT_HOME=/var/lib/mychat/
project.folder=${MYCHAT_HOME:D:/mychat/}
#日志级别配置。
#root原来是debug，接上大模型之后Spring AI会把每一个SSE分片、每一次工具调用
#都按DEBUG打出来，控制台一秒刷几十屏，自己的日志全被冲走了。
#root降到info，项目自身的包单独给一个级别，想看SQL就把log.app.level改回debug
log.root.level=info
log.app.level=debug
# 超级管理员邮箱，多个用逗号分隔。用这个邮箱注册的账号能进管理后台，
# 部署后请改成你自己的
admin.emails=${ADMIN_EMAILS:admin@example.com}

# 聊天消息内容最大允许长度（字符数），超长时 sendMessage 返回明确错误提示
message.max-length=${MESSAGE_MAX_LENGTH:5000}

# ==================== AI 配置 ====================
# AI 相关配置全部在同目录的 application.yml 里。
# 原因：Spring Boot 读 .properties 时写死用 ISO-8859-1（见 OriginTrackedPropertiesLoader），
# 中文写在这里一定乱码；yml 走 SnakeYAML 默认 UTF-8，所以助手昵称、人设那些中文放 yml。
