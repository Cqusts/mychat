# 应用服务 WEB 访问端口
server.port=5050
ws.port=5051
server.servlet.context-path=/api
#session过期时间 60M 一个小时
server.servlet.session.timeout=PT60M
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
#错误页处理
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
#数据库配置
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/easychat?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf8&autoReconnect=true&allowMultiQueries=true\
  &useSSL=false
spring.datasource.username=root
spring.datasource.password=111111
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.pool-name=HikariCPDatasource
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=180000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1
#Spring redis配置（Spring Boot 3.x使用spring.data.redis前缀）
# Redis数据库索引（默认为0）
spring.data.redis.database=0
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
# 连接池最大连接数（使用负值表示没有限制）
spring.data.redis.jedis.pool.max-active=20
# 连接池最大阻塞等待时间（使用负值表示没有限制）
spring.data.redis.jedis.pool.max-wait=-1
# 连接池中的最大空闲连接
spring.data.redis.jedis.pool.max-idle=10
# 连接池中的最小空闲连接
spring.data.redis.jedis.pool.min-idle=0
# 连接超时时间（毫秒）
spring.data.redis.timeout=2000
#项目目录
project.folder=D:/easychat/
#日志级别配置
log.root.level=debug
#超级管理员id
admin.emails=test@qq.com

# ==================== AI大模型配置（需要自行填写） ====================
# API密钥（必填）- 替换为你自己的API Key
spring.ai.openai.api-key=YOUR_API_KEY_HERE
# API地址（必填）- 根据你选择的大模型厂商填写
# OpenAI: https://api.openai.com
# 阿里通义千问: https://dashscope.aliyuncs.com/compatible-mode
# DeepSeek: https://api.deepseek.com
# 智谱GLM: https://open.bigmodel.cn/api/paas
spring.ai.openai.base-url=https://api.deepseek.com
# 模型名称（必填）
# OpenAI: gpt-3.5-turbo / gpt-4o | 通义千问: qwen-turbo | DeepSeek: deepseek-chat | 智谱: glm-4-flash
spring.ai.openai.chat.options.model=deepseek-chat
# 生成随机性 0-1，值越大回复越随机
spring.ai.openai.chat.options.temperature=0.7
# 兜底系统提示词：助手没有在ai.agents里配置自己的prompt时用这个
ai.chat.system-prompt=你是EasyChat的智能助手小E，性格友好活泼，用简洁的中文回答问题。你可以调用工具查询当前用户的好友列表、群聊列表和聊天记录：需要这些信息时直接调用工具，不要凭空编造，也不要向用户索要联系人ID（用listFriends或listGroups自己查）。遇到“上周”“昨天”这类相对时间，先调getCurrentTime确认今天是哪天。如果用户打招呼，请热情回应。
# 保留的最大对话历史轮数（一问一答为一轮）
ai.chat.max-history=20

# -------------------- AI流式输出 --------------------
# 片段聚合：缓冲区攒够多少个字符就推送一次
ai.chat.stream.flush-chars=20
# 片段聚合：距上次推送超过多少毫秒就推送一次
# 两个阈值共同作用，避免每个token都触发一次Redis广播 + WebSocket写
ai.chat.stream.flush-interval-ms=80

# -------------------- AI任务线程池 --------------------
# 调用大模型是IO密集型操作，放独立线程池执行，不占用Tomcat的HTTP工作线程
ai.chat.executor.core-size=16
ai.chat.executor.max-size=64
# 队列不宜过深，排太久还不如快速失败让用户重试
ai.chat.executor.queue-capacity=64
ai.chat.executor.keep-alive-seconds=60
# 单次流式回复的整体超时（秒），防止模型不返回时永久占住线程池线程
ai.chat.stream.timeout-seconds=120
# AI对话历史在Redis中的过期天数，每次追加都会续期
ai.chat.history.expire-days=7

# -------------------- AI工具调用（Function Calling） --------------------
# 是否开放业务工具（查好友/查群/搜聊天记录/查时间）给模型调用
# 换到不支持Function Calling的模型上可以关掉，退回纯对话
ai.chat.tools.enabled=true

# -------------------- 群聊多Agent协作 --------------------
# 助手之间互相接话的最大轮数。助手可以@别的助手，必须有硬上限防止无限对话
ai.chat.group.max-depth=3
# 拼给助手看的群聊上下文条数
ai.chat.group.context-size=15

# -------------------- AI助手列表 --------------------
# 每个助手都是一个真实存在的用户（启动时自动写入user_info），可以加为好友私聊、被拉进群、被@
# id必须以U开头且不超过12个字符（user_info.user_id字段长度限制）
# description是给用户看的能力说明，多条能力用 | 分隔，前端会拆成列表展示
#   （prompt是给模型看的人设，两者用途不同）

# [0] 内置助手。id必须等于Constants.ROBOT_UID（U+robot），注册时会自动加为好友。
# 之前它没有user_info记录，而通讯录查好友是inner join user_info，所以一直显示不出来
ai.agents[0].id=Urobot
ai.agents[0].name=智能助手小E
ai.agents[0].signature=有什么想问的都可以找我
ai.agents[0].description=回答日常问题，陪你聊天|帮你查好友列表和群聊列表|按关键词搜索你和某人的聊天记录|记得住上下文，可以连着多轮问
ai.agents[0].prompt=你是EasyChat的智能助手小E，性格友好活泼，用简洁的中文回答问题。如果用户打招呼，请热情回应。

ai.agents[1].id=Uagentpm
ai.agents[1].name=产品经理小P
ai.agents[1].signature=从用户价值出发想问题
ai.agents[1].description=帮你判断一个需求值不值得做|梳理需求优先级和使用场景|追问方案背后的用户价值|适合拉进群里一起评审需求
ai.agents[1].prompt=你是一名资深产品经理，习惯从用户价值、需求优先级和使用场景的角度思考问题。你会追问“这个功能解决了谁的什么问题”，对没想清楚用户价值的方案保持怀疑。

ai.agents[2].id=Uagentarch
ai.agents[2].name=架构师小A
ai.agents[2].signature=先问可行性和复杂度
ai.agents[2].description=评估技术方案的可行性和工作量|指出数据一致性、并发和扩展性上的坑|权衡长期维护成本，拦住过度设计|适合拉进群里做技术评审
ai.agents[2].prompt=你是一名后端架构师，习惯从技术可行性、系统复杂度和长期维护成本的角度思考问题。你会关注数据一致性、并发和扩展性，对会引入过度复杂度的方案保持警惕。

ai.agents[3].id=Uagentqa
ai.agents[3].name=测试工程师小T
ai.agents[3].signature=专门想边界情况
ai.agents[3].description=帮你找出没考虑到的边界情况|梳理异常路径和失败场景|提醒并发、超时、脏数据这类隐患|适合拉进群里挑方案的毛病
ai.agents[3].prompt=你是一名测试工程师，习惯从边界情况、异常路径和质量风险的角度思考问题。你会主动指出别人没考虑到的失败场景，比如并发、超时、脏数据和用户误操作。
